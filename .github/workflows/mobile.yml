name: Mobile

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Clean install, isolation tests, and platform bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm test
      - name: Verify UI evidence freshness regression
        run: python3 -m unittest discover -s integration -p 'test_*.py'
      - run: npm ci --prefix services/push
      - name: Collect npm license metadata and original notices
        run: npm run licenses:report
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-npm-license-evidence
          path: dist/licenses/
          if-no-files-found: error
          retention-days: 90
      - run: npm run typecheck --prefix services/push
      - run: npm test --prefix services/push
      - run: npm run bundle:android
      - run: npm run bundle:ios
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-platform-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 14

  upstream:
    name: Real upstream HTTPS accounts, API and push queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: croffasia/itsaplan
          ref: 73aadf9945ec4c8a23c749fb4f4dee25b036acb3
          path: .upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix services/push
      - name: Install pinned upstream Bun runtime
        run: npm install --prefix "$RUNNER_TEMP/ipm-tools" bun@1.4.3 --no-audit --no-fund
      - name: Install upstream dependencies from lockfile
        working-directory: .upstream
        run: '"$RUNNER_TEMP/ipm-tools/node_modules/.bin/bun" install --frozen-lockfile'
      - name: Verify two HTTPS servers, independent accounts, tasks, comments and logout
        run: node integration/run.mjs
        env:
          UPSTREAM_ROOT: ${{ github.workspace }}/.upstream
          BUN_BINARY: ${{ runner.temp }}/ipm-tools/node_modules/.bin/bun
          UPSTREAM_DB_URL: postgres://postgres@127.0.0.1:5432/postgres

  android:
    name: Android debug and standalone APKs
    needs: [validate, upstream]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install SDK toolchain required by React Native 0.88
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build debug APK for device and emulator
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build standalone preview for an Android device
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 --max-workers=2 --stacktrace
      - name: Record resolved Android runtime dependencies
        working-directory: android
        run: |
          mkdir -p ../dist/native-licenses
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 --max-workers=2 > ../dist/native-licenses/android-runtime-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-dependency-evidence
          path: dist/native-licenses/
          if-no-files-found: error
          retention-days: 90
      - name: Verify JavaScript is embedded in the preview APK
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk') as apk:
              assert apk.getinfo('assets/index.android.bundle').file_size > 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-standalone-preview
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/checkout@v4
        with:
          repository: croffasia/itsaplan
          ref: 73aadf9945ec4c8a23c749fb4f4dee25b036acb3
          path: .upstream
          persist-credentials: false
      - run: npm ci --prefix services/push
      - name: Install pinned upstream Bun runtime
        run: npm install --prefix "$RUNNER_TEMP/ipm-tools" bun@1.4.3 --no-audit --no-fund
      - name: Install upstream dependencies from lockfile
        working-directory: .upstream
        run: '"$RUNNER_TEMP/ipm-tools/node_modules/.bin/bun" install --frozen-lockfile'
      - name: Start disposable native HTTPS account fixtures
        run: |
          UPSTREAM_ROOT="$GITHUB_WORKSPACE/.upstream" \
          BUN_BINARY="$RUNNER_TEMP/ipm-tools/node_modules/.bin/bun" \
          UPSTREAM_DB_URL=postgres://postgres@127.0.0.1:5432/postgres \
          NATIVE_FIXTURE_DIR="$RUNNER_TEMP/ipm-native" \
          node integration/run.mjs --serve-native > "$RUNNER_TEMP/ipm-native-startup.log" 2>&1 &
          node integration/wait-native-fixture.mjs "$RUNNER_TEMP/ipm-native/state.json"
      - name: Prepare test-only package with localhost trust
        run: node integration/prepare-native-contract.mjs "$RUNNER_TEMP/ipm-native/state.json"
      - name: Build isolated native account contract APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 --max-workers=2 --stacktrace
      - name: Verify pilot and test APK isolation
        run: python3 integration/check-native-artifacts.py "$RUNNER_TEMP/ipm-native/build.json" android/app/build/outputs/apk/release/app-release.apk
      - name: Release build memory before the emulator
        working-directory: android
        run: ./gradlew --stop
      - name: Allow the hosted runner to use KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify native sessions, secure storage and unavailable-server isolation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 integration/android-native-contract.py android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ipm-native/state.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-native-account-evidence
          path: test-results/native-contract/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop disposable native account fixtures
        if: always()
        run: node integration/stop-native-fixture.mjs "$RUNNER_TEMP/ipm-native/state.json"

  android-ui:
    name: Android emulator UI and screenshot evidence
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android-standalone-preview
          path: test-results/apk
      - name: Allow the hosted runner to use KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run native UI smoke checks on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 integration/android-ui-smoke.py test-results/apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-ui-evidence
          path: test-results/android-ui/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator application
    needs: [validate, upstream]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Record native toolchain
        run: xcodebuild -version
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Collect resolved CocoaPods licenses
        run: |
          mkdir -p dist/native-licenses
          cp ios/Podfile.lock dist/native-licenses/Podfile.lock
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          files = list(Path('ios/Pods/Target Support Files').glob('*/*-acknowledgements.*'))
          if not files:
              raise SystemExit('CocoaPods acknowledgement files were not generated')
          for file in files:
              shutil.copyfile(file, Path('dist/native-licenses') / file.name)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-license-evidence
          path: dist/native-licenses/
          if-no-files-found: error
          retention-days: 90
      - name: Build unsigned simulator application
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build -jobs 3 CODE_SIGNING_ALLOWED=NO
          mkdir -p dist/native
          ditto -c -k --sequesterRsrc --keepParent \
            "ios/build/Build/Products/Debug-iphonesimulator/$scheme.app" \
            dist/native/itsaplan-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-simulator-app
          path: dist/native/itsaplan-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/checkout@v4
        with:
          repository: croffasia/itsaplan
          ref: 73aadf9945ec4c8a23c749fb4f4dee25b036acb3
          path: .upstream
          persist-credentials: false
      - run: npm ci --prefix services/push
      - name: Install native fixture prerequisites
        run: |
          npm install --prefix "$RUNNER_TEMP/ipm-tools" bun@1.4.3 --no-audit --no-fund
          brew install postgresql@17
          pg_bin="$(brew --prefix postgresql@17)/bin"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/ipm-postgres" -A trust -U postgres
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/ipm-postgres" -l "$RUNNER_TEMP/ipm-postgres.log" -o '-h 127.0.0.1 -p 54329' start
      - name: Install upstream dependencies from lockfile
        working-directory: .upstream
        run: '"$RUNNER_TEMP/ipm-tools/node_modules/.bin/bun" install --frozen-lockfile'
      - name: Start disposable native HTTPS account fixtures
        run: |
          UPSTREAM_ROOT="$GITHUB_WORKSPACE/.upstream" \
          BUN_BINARY="$RUNNER_TEMP/ipm-tools/node_modules/.bin/bun" \
          UPSTREAM_DB_URL=postgres://postgres@127.0.0.1:54329/postgres \
          NATIVE_FIXTURE_DIR="$RUNNER_TEMP/ipm-native" \
          node integration/run.mjs --serve-native > "$RUNNER_TEMP/ipm-native-startup.log" 2>&1 &
          node integration/wait-native-fixture.mjs "$RUNNER_TEMP/ipm-native/state.json"
      - name: Build isolated iOS native contract application
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          # The normal simulator artifact was already uploaded. Release uses its
          # embedded bundle, without a development Metro server.
          printf '\nexport ENTRY_FILE="%s/integration/native-contract-entry.tsx"\n' "$GITHUB_WORKSPACE" >> ios/.xcode.env.local
          bundle_id=$(node -p 'require("./app.json").expo.ios.bundleIdentifier + ".contracttest"')
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build -jobs 3 CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$bundle_id" ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES
          python3 integration/ios-native-contract.py \
            "ios/build/Build/Products/Release-iphonesimulator/$scheme.app" \
            "$RUNNER_TEMP/ipm-native/state.json"
      - name: Measure shared text at iOS accessibility maximum size
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          printf '\nexport ENTRY_FILE="%s/integration/font-scale-entry.tsx"\n' "$GITHUB_WORKSPACE" >> ios/.xcode.env.local
          bundle_id=$(node -p 'require("./app.json").expo.ios.bundleIdentifier + ".fonttest"')
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build -jobs 3 CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$bundle_id" ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES
          python3 integration/ios-font-scale.py "ios/build/Build/Products/Release-iphonesimulator/$scheme.app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-font-scale-evidence
          path: test-results/ios-font-scale/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-native-account-evidence
          path: test-results/ios-native-contract/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop disposable native fixtures and PostgreSQL
        if: always()
        shell: bash
        run: |
          node integration/stop-native-fixture.mjs "$RUNNER_TEMP/ipm-native/state.json"
          pg_bin="$(brew --prefix postgresql@17)/bin"
          if test -f "$RUNNER_TEMP/ipm-postgres/postmaster.pid"; then
            "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/ipm-postgres" -m fast stop
          fi
